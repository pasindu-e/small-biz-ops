name: SmallBizOps
options:
  bundleIdPrefix: com.northstargoods
  deploymentTarget:
    iOS: "17.0"
targets:
  SmallBizOps:
    type: application
    platform: iOS
    sources:
      - path: SmallBizOps
    info:
      path: SmallBizOps/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: "SmallBizOps uses Face ID to sign you in securely."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.northstargoods.smallbizops
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
